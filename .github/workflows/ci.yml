name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -e '.[dev,packaging]'
      - run: ruff check .
      - run: pytest -q
      - run: remote-mcp-package build --repo . --commit HEAD --output /tmp/remote-mcp-package
      - run: remote-mcp-package verify --bundle /tmp/remote-mcp-package
